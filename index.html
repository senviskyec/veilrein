<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veilrein — Wiki</title>
  <link rel="stylesheet" href="styles/index.css">
  <link rel="stylesheet" href="styles/council-strip.css">
</head>
<body>

  <!-- ===================== TOP BAR ===================== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-text">Veilrein <span>Wiki</span></span>
    </div>
    <nav class="topnav">
      <a href="#" class="active">Home</a>
      <a href="#">Economy</a>
      <a href="#">Government</a>
      <a href="#">Politics</a>
      <a href="#">Jobs</a>
      <a href="#">Laws</a>
      <a href="#">Crime</a>
      <a href="#">Guides</a>
    </nav>
  </header>


  <!-- ---------- MAIN CONTENT ---------- -->
  <main class="content">

    <div class="hero-image">
      <img src="PUT_YOUR_IMAGE_URL_HERE.png" alt="Veilrein">
    </div>

    <!-- DESCRIPTION -->
    <p class="description">
      Wtf.
    </p>

    <!-- CURRENT COUNCIL -->
    <h2 class="section-title">Current Council</h2>

    <!-- The scroll container. On narrow screens this scrolls left/right
         instead of squashing or clipping the cards. -->
    <div class="council-scroll">
      <div class="council-track">

        <!-- Each card gets a theme class: theme-architect, theme-wanderer, etc. -->
        <a class="councillor theme-architect" href="../veilrein/council/cyn.html">
          <div class="title">The Architect</div>
          <div class="councillor-photo">
            <img src="images/wwyrim2.png" alt="Wwyrim">
          </div>
          <div class="councillor-name">Cyn</div>
        </a>

        <a class="councillor theme-wanderer" href="#">
          <div class="title">The Wanderer</div>
          <div class="councillor-photo">
            <img src="images/zero.png" alt="Zero">
          </div>
          <div class="councillor-name">Zero</div>
        </a>

        <a class="councillor theme-shaman" href="#">
          <div class="title">The Shaman</div>
          <div class="councillor-photo">
            <img src="images/shaman.jpg" alt="Spectra">
          </div>
          <div class="councillor-name">Spectra</div>
        </a>

        <a class="councillor theme-beast" href="#">
          <div class="title">The Beast</div>
          <div class="councillor-photo">
            <img src="images/delevan.png" alt="Delevan">
          </div>
          <div class="councillor-name">Delevan</div>
        </a>

        <a class="councillor theme-witch" href="#">
          <div class="title">The Witch</div>
          <div class="councillor-photo">
            <img src="images/witch.jpg" alt="Cyn">
          </div>
          <div class="councillor-name">Cyn</div>
        </a>

        <a class="councillor theme-reaper" href="#">
          <div class="title">The Reaper</div>
          <div class="councillor-photo">
            <img src="images/reaper.jpg" alt="">
          </div>
          <div class="councillor-name">Name</div>
        </a>

        <a class="councillor theme-hunter" href="#">
          <div class="title">The Hunter</div>
          <div class="councillor-photo">
            <img src="images/hunter.jpg" alt="">
          </div>
          <div class="councillor-name">Name</div>
        </a>

      </div>
    </div>

  </main>

</body>
</html>
